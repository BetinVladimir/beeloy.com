# Local development: ports are bound to 127.0.0.1 only. Use together with the base file:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/compose.dev.yml up -d
services:
  postgres:
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    networks: [internal]
  s3:
    # S3-compatible storage for local development (MinIO's public images are no longer available)
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_INITIALBUCKETS: beeloy
    ports: ["127.0.0.1:9090:9090"]
    networks: [internal]
  api:
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9091:9090"]
    environment: &dev
      APP_ENV: dev
      HTTP_ADDR: ":8080"
      PUBLIC_BASE_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-beeloy}:${POSTGRES_PASSWORD:-beeloy}@postgres:5432/${POSTGRES_DB:-beeloy}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      OTP_HMAC_SECRET: dev-only-otp-secret-dev-only-otp-secret
      PROXY_SHARED_SECRET: dev-proxy-secret-dev-proxy-secret-00
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: no-reply@beeloy.local
      S3_ENDPOINT: http://s3:9090
      S3_REGION: us-east-1
      S3_BUCKET: beeloy
      S3_ACCESS_KEY: dev
      S3_SECRET_KEY: dev
    depends_on: [mailpit, s3]
  content-sync:
    environment: *dev
    depends_on: [s3]
  migrate:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-beeloy}:${POSTGRES_PASSWORD:-beeloy}@postgres:5432/${POSTGRES_DB:-beeloy}?sslmode=disable
