# Production-like stack. Start with:  docker compose --profile prod -f infra/compose/docker-compose.yml up -d
# Without --profile prod only the application services run (used by compose.dev.yml for local development).
name: beeloy

x-backend: &backend
  image: ${BACKEND_IMAGE:-beeloy-backend:local}
  build:
    context: ../..
    dockerfile: backend/Dockerfile
  env_file:
    - path: ../../.env
      required: false # absent in local development (compose.dev.yml sets everything)
  restart: unless-stopped
  networks: [internal]

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beeloy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-beeloy}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beeloy} -d ${POSTGRES_DB:-beeloy}"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256m
    networks: [internal]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    logging: *logging

  migrate:
    <<: *backend
    command: ["/migrate", "up"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  api:
    <<: *backend
    networks: [internal, proxy] # `proxy` is shared only with Caddy: TRUSTED_PROXY_CIDRS is Caddy's fixed address there
    command: ["/api"]
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      # distroless has no shell or curl: the binary itself answers the probe
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    logging: *logging

  content-sync:
    <<: *backend
    command: ["/content-sync", "run"]
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    mem_limit: 128m
    logging: *logging

  caddy:
    image: caddy:2
    profiles: [prod]
    restart: unless-stopped
    ports: ["443:443"]
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/beeloy/certs:/etc/caddy/certs:ro # origin.pem, origin.key, cf-origin-pull-ca.pem (created by a human, never in git)
      - caddy_data:/data
    depends_on: [api]
    networks:
      edge: {}
      proxy: { ipv4_address: 172.30.0.2 }
    env_file: [../../.env] # CLOUDFLARE_CIDRS
    mem_limit: 128m
    logging: *logging

  backup:
    profiles: [prod]
    build: ../backup
    restart: unless-stopped
    env_file: [../../.env]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    logging: *logging

networks:
  internal: { internal: false }
  edge: {}
  proxy:
    ipam:
      config: [{ subnet: 172.30.0.0/29 }]

volumes:
  pg_data:
  redis_data:
  caddy_data:
